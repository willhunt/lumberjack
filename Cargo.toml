# One workspace over the Rust crates, so they share a target directory and a
# single Cargo.lock rather than resolving their dependencies separately.
#
#     cargo build --workspace      everything
#     cargo test -p lumberdaq      one crate
#     cd lumberdaq && cargo run    unchanged, still runs the CLI
#
# Build output now lands in ./target rather than in each crate.
[workspace]
resolver = "2"
members = [
    "lumberdaq",  # the library and its CLI
    "picolog",    # safe wrappers over the Pico driver, used by lumberdaq
    "nidaqmx",    # the same for National Instruments, for legacy USB-6001 hardware
    "choptui",    # terminal monitor, a separate crate on purpose
]
# Cargo insists every nested crate is either a member or excluded here.
#
# app/     the legacy Tauri prototype. Its own toolchain, not part of this.
# sandbox/ one-off measurements, deliberately standing apart: storage_bench
#          pins an older rusqlite, and joining would build bundled SQLite twice.
exclude = [
    "app",
    "sandbox",
]
